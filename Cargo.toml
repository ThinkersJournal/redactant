[package]
name = "redactant"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Secret values that cannot leak through formatting: blank Display and Debug, an explicit expose(), zeroize on drop."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/redactant"
readme = "README.md"
publish = false

[features]
# Enables the compile_fail (trybuild) test target; CI runs it in its own job on a pinned rustc.
ui-tests = []
# Serialize writes the placeholder, never the value; Deserialize reads a value into a Secret.
serde = ["dep:serde"]

[[test]]
name = "compile_fail"
required-features = ["ui-tests"]

[dependencies]
zeroize = "1.9.1"
serde = { version = "1.0.229", optional = true, default-features = false }
hmac = "0.13.0"
sha2 = "0.11.1"

[dev-dependencies]
# Self-dependency: turns the `serde` feature on for tests and doctests, so the README example runs under plain `cargo test`.
redactant = { path = ".", features = ["serde"] }
trybuild = "1.0.122"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
