# The `[architecture]` declaration (ARC/MOD programme, CireSnave 2026-11-12). NORMATIVE: it says where things should sit.
# One crate, four groups. `secret` (src/secret.rs: `Secret<T>`, `PLACEHOLDER`, the serde impls) is the bottom; `fingerprint` and `scrubber`
# build on it; `api` is the crate root (src/lib.rs), which only declares the modules and re-exports their public items, so it sits on top.
# Layers are bottom first: a component may depend on its own layer or any layer below it. Measured 2026-11-12 at main 0562051 by
# reading `crate::` paths and `mod`/`pub use` lines. Owner: the redactant lane.
[architecture]
style = "layered"

[[architecture.component]]
name = "secret"
paths = ["src/secret.rs"]
role = "policy"
volatility = "stable"
# The one place that names the placeholder text: no other file under src/ writes the literal (PLACEHOLDER is imported from here).
owns_data = ["<redacted>"]

[[architecture.component]]
name = "fingerprint"
paths = ["src/fingerprint.rs"]
# Wraps the outside crates hmac and sha2 behind Fingerprint and FingerprintKey.
role = "adapter"

[[architecture.component]]
name = "scrubber"
paths = ["src/scrubber.rs"]
role = "policy"

[[architecture.component]]
name = "api"
paths = ["src/lib.rs"]
role = "policy"

[[architecture.layer]]
name = "core"
components = ["secret"]

[[architecture.layer]]
name = "services"
components = ["fingerprint", "scrubber"]

[[architecture.layer]]
name = "facade"
components = ["api"]

# Volatile details: the keyed-hash crates behind fingerprints (only `fingerprint` names them). No volatile `names`.
# ARC-003 judges whole crates only in 0.43.54 (module groups are not judged), so this table is declared intent until it reads them.
[architecture.volatile]
names = []
namespaces = ["hmac", "sha2"]
feature_cfg_in_policy = true

# Public items per component (ARC-006), counted by hand from src/secret.rs at 6f3a653: PLACEHOLDER, Secret, Secret::new, Secret::expose = 4.
# A ceiling to hold. coderipper 0.43.x does not judge module groups, so nothing checks it yet; it is declared intent.
[architecture.api_budget]
secret = 4

# No [architecture.composition]: this is a library that only re-exports; nothing in it wires adapters together, so there is no root to declare.
# ARC-012 therefore does not run here (it needs a root). Left out rather than contrived; see redactant#19.
