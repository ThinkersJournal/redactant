# The `[architecture]` declaration (ARC/MOD programme, CireSnave 2026-11-12). NORMATIVE: it says where things should sit.
# One crate, four groups. `secret` (src/secret.rs: `Secret<T>`, `PLACEHOLDER`, the serde impls) is the bottom; `fingerprint` and `scrubber`
# build on it; `api` is the crate root (src/lib.rs), which only declares the modules and re-exports their public items, so it sits on top.
# Layers are bottom first: a component may depend on its own layer or any layer below it. Measured 2026-11-12 at main 0562051 by
# reading `crate::` paths and `mod`/`pub use` lines. Owner: the redactant lane.
[architecture]
style = "layered"

[[architecture.component]]
name = "secret"
paths = ["src/secret.rs"]
role = "policy"
volatility = "stable"

[[architecture.component]]
name = "fingerprint"
paths = ["src/fingerprint.rs"]
role = "policy"

[[architecture.component]]
name = "scrubber"
paths = ["src/scrubber.rs"]
role = "policy"

[[architecture.component]]
name = "api"
paths = ["src/lib.rs"]
role = "policy"

[[architecture.layer]]
name = "core"
components = ["secret"]

[[architecture.layer]]
name = "services"
components = ["fingerprint", "scrubber"]

[[architecture.layer]]
name = "facade"
components = ["api"]

# Volatile details: the keyed-hash crates behind fingerprints (only `fingerprint` names them). No volatile `names`.
# ARC-003 judges whole crates only in 0.43.54 (module groups are not judged), so this table is declared intent until it reads them.
[architecture.volatile]
names = []
namespaces = ["hmac", "sha2"]
feature_cfg_in_policy = true

# No [architecture.api_budget]: ARC-006 (coderipper 0.43.54) judges whole crates only ("module groups are not judged in this version"), so a budget
# for a module of this one crate would be a number nothing checks. Add one when ARC-006 reads module groups.
